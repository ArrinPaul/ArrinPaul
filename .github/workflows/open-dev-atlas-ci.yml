name: Open Dev Atlas CI

on:
  push:
    branches: [main]
    paths:
      - 'open-dev-atlas/**'
      - '.github/workflows/open-dev-atlas-ci.yml'
  pull_request:
    paths:
      - 'open-dev-atlas/**'
      - '.github/workflows/open-dev-atlas-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: open-dev-atlas

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: open-dev-atlas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
