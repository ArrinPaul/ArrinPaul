name: Generate Pacman Animation

on:
  schedule: # Six runs a week: Sun/Thu 00:00, Mon/Fri 08:00, Tue/Sat 16:00 UTC (none on Wednesday)
    - cron: "0 0 * * 0,4"
    - cron: "0 8 * * 1,5"
    - cron: "0 16 * * 2,6"

  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - 'open-dev-atlas/**'

concurrency:
  group: pacman-graph
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Third-party actions are pinned to a commit so a change upstream cannot run in this repo unreviewed.
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa # main
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd # v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
