name: Update timeStats

on:
  schedule: # Six runs a week: Sun/Thu 00:00, Mon/Fri 08:00, Tue/Sat 16:00 UTC (none on Wednesday)
    - cron: '0 0 * * 0,4'
    - cron: '0 8 * * 1,5'
    - cron: '0 16 * * 2,6'
  workflow_dispatch:

# Share one queue with the stats-cache workflow: both commit to README.md.
concurrency:
  group: readme-updates
  cancel-in-progress: false

jobs:
  update-readme-waka:
    name: Update Readme with WakaTime Data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to a commit: this action receives personal access tokens.
      - name: Update WakaTime Stats
        uses: anmol098/waka-readme-stats@4db28e08bfd8bac570125799fe1cfdcb23a8c871 # master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_LINES_OF_CODE: false
          SHOW_TOTAL_CODE_TIME: false
          SHOW_PROFILE_VIEWS: false
          SHOW_COMMIT: true
          SHOW_DAYS_OF_WEEK: true
          SHOW_LANGUAGE_PER_REPO: true
          SHOW_LANGUAGE: false
          SHOW_OS: false
          SHOW_PROJECTS: false
          SHOW_TIMEZONE: false
          SHOW_EDITORS: false
          SHOW_SHORT_INFO: false
          SHOW_LOC_CHART: false
          LOCALE: 'en'
