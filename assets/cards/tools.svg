<title id="t">Tools and frameworks</title><desc id="d">Languages: Python, TypeScript, JavaScript, Java, C, HTML, CSS, LaTeX. Frontend: React, Next.js, Angular, Vite, Tailwind CSS, Three.js. Backend: Node.js, Express, NestJS, FastAPI, Spring Boot, Socket.IO, BullMQ. Data: PostgreSQL, MongoDB, Redis, Supabase, Firebase, Convex, Drizzle ORM. AI and ML: PyTorch, TensorFlow, OpenCV, scikit-learn, NumPy, pandas, MediaPipe, Gemini API, Genkit. Services: Clerk, Stripe, n8n. DevOps and testing: Docker, GitHub Actions, Vercel, Nginx, AWS, Git, GitHub, pnpm, Turborepo, Jest, Vitest, Playwright, Zod</desc>
